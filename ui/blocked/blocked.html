<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site bloqueado — Foco</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="page">
      <div class="card" role="alert" aria-live="assertive">
        <div class="illu" aria-hidden="true">🌿</div>
        <h1>Ops! Este site está bloqueado</h1>
        <p class="sub">
          Este endereço pode ser da lista de bloqueio no Foco ou ter atingido o
          <strong>limite de tempo</strong> deste site hoje. Se foi sem querer, você pode
          ajustar nas opções da extensão.
        </p>
        <div class="actions">
          <button type="button" class="primary" id="openOpts">Abrir opções do Foco</button>
          <button type="button" class="secondary" id="back">Página anterior</button>
        </div>
        <p class="foot">Extensão <strong>Foco</strong> — concentre-se no que importa.</p>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
